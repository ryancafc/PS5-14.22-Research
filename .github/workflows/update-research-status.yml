name: Update research status
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: research-status-main
  cancel-in-progress: false
jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record reviewed commit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          from datetime import datetime, timezone
          p = Path("exploits/jailbreak-possibility-percentage.txt")
          lines = p.read_text().splitlines()
          lines = [line for line in lines if not line.startswith(("Latest triggering commit:", "Last automatic status refresh:"))]
          lines.append("Latest triggering commit: " + os.environ["GITHUB_SHA"])
          lines.append("Last automatic status refresh: " + datetime.now(timezone.utc).isoformat())
          p.write_text("\n".join(lines) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exploits/jailbreak-possibility-percentage.txt
          if ! git diff --cached --quiet; then
            git commit -m "Refresh research status metadata [skip ci]"
            git push origin HEAD:main
          fi
